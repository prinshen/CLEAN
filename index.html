<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CLEAN</title>
<link rel="stylesheet" href="./style.css?v=5">
</head>
<body>
<div id="notice" role="alert"></div>
<main id="app"><section id="startup" style="padding:32px;font-family:system-ui;color:#24364b"><h1>CLEAN</h1><p id="startup-message">Åbner dine rengøringsopgaver…</p><noscript>JavaScript er slået fra. CLEAN kræver JavaScript for at vise opgaver og timer.</noscript></section></main>
<script>
(function () {
  function showError(message) {
    var target = document.getElementById('notice');
    target.textContent = 'CLEAN kunne ikke starte: ' + message;
    target.style.cssText = 'padding:20px;background:#f2dec7;color:#493320;font:16px system-ui;white-space:pre-wrap';
    var startup = document.getElementById('startup-message');
    if (startup) startup.textContent = 'Send gerne teksten ovenfor, så fejlen kan rettes.';
  }
  window.addEventListener('error', function (event) {
    if (event.target && event.target.tagName === 'SCRIPT') showError('En nødvendig scriptfil kunne ikke indlæses.');
    else showError(event.message || 'Ukendt JavaScript-fejl.');
  }, true);
  window.addEventListener('unhandledrejection', function (event) {
    showError(String(event.reason && event.reason.message || event.reason || 'Ukendt fejl.'));
  });
  setTimeout(function () {
    if (document.getElementById('startup') && !document.getElementById('notice').textContent) {
      showError('Opstarten blev ikke fuldført. Version 5.');
    }
  }, 10000);
})();
</script>
<script src="./core.js?v=5"></script>
<script src="./app.js?v=5"></script>
</body>
</html>
